name: Firmware resource matrix

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board id to calibrate, or all for every catalog board
        required: true
        type: string
        default: core8
      coverage:
        description: Bounded resource calibration coverage
        required: true
        type: choice
        default: singles
        options:
          - baseline
          - singles
          - full
          - expanded

permissions:
  contents: read

concurrency:
  group: firmware-resource-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan resource builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
    env:
      INPUT_BOARD: ${{ inputs.board }}
      INPUT_COVERAGE: ${{ inputs.coverage }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out fixed master source
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Plan canonical profiles
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/calibration-matrix.json"
          python3 misc/firmware_builder/calibration.py plan \
            --root "$GITHUB_WORKSPACE" \
            --board "$INPUT_BOARD" \
            --coverage "$INPUT_COVERAGE" \
            --output "$matrix_file"
          python3 - "$matrix_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matrix = json.dumps(document, separators=(",", ":"))
          print("matrix=" + matrix)
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write("matrix=" + matrix + "\n")
          PY
          source_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Upload calibration plan
        uses: actions/upload-artifact@v7
        with:
          name: firmware-resource-plan
          path: ${{ runner.temp }}/calibration-matrix.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Resource / ${{ matrix.profile_id }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BOARD_ID: ${{ matrix.board_id }}
      PROFILE_ID: ${{ matrix.profile_id }}
      FEATURES: ${{ matrix.features }}
      VE_RPM_COUNT: ${{ matrix.ve_rpm_count }}
      AIRMASS_BLEND_SIZE: ${{ matrix.airmass_blend_size }}
      CYLINDER_TRIM_COUNT: ${{ matrix.cylinder_trim_count }}
      ENGINE_PRESETS: ${{ matrix.engine_presets }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out planned source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: '21'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            mtools \
            dosfstools \
            zip \
            xxd \
            rsync

      - name: Resolve canonical profile
        shell: bash
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/resolved-profile.json"
          args=(
            python3 misc/firmware_builder/catalog.py resolve
            --root "$GITHUB_WORKSPACE"
            --board "$BOARD_ID"
            --features "$FEATURES"
            --ve-rpm-count "$VE_RPM_COUNT"
            --airmass-blend-size "$AIRMASS_BLEND_SIZE"
            --engine-presets "$ENGINE_PRESETS"
            --output "$resolved"
            --github-env "$GITHUB_ENV"
          )
          if [[ "$CYLINDER_TRIM_COUNT" != "0" ]]; then
            args+=(--cylinder-trim-count "$CYLINDER_TRIM_COUNT")
          fi
          "${args[@]}"

      - name: Expose bundled ARM binutils
        shell: bash
        run: |
          set -euo pipefail
          toolchain_dir="$GITHUB_WORKSPACE/firmware/ext/build-tools/arm-gnu-toolchain-11.3.rel1-x86_64-arm-none-eabi/bin"
          binutils_dir="$GITHUB_WORKSPACE/build/resource-matrix-binutils"
          mkdir -p "$binutils_dir"
          for tool in objcopy objdump; do
            test -x "$toolchain_dir/arm-none-eabi-$tool"
            ln -sf "$toolchain_dir/arm-none-eabi-$tool" "$binutils_dir/$tool"
          done
          printf 'PATH=%s:%s\n' "$binutils_dir" "$PATH" >> "$GITHUB_ENV"

      - name: Build firmware
        shell: bash
        env:
          JOBS: '4'
        run: |
          set -euo pipefail
          cd "$BOARD_DIR"
          bash "$COMPILE_SCRIPT"

      - name: Collect resource observation
        shell: bash
        run: |
          set -euo pipefail
          python3 misc/firmware_builder/calibration.py collect \
            --root "$GITHUB_WORKSPACE" \
            --board "$BOARD_ID" \
            --output "$RUNNER_TEMP/resource-observation-$PROFILE_ID"

      - name: Upload observation and resource index
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: resource-observation-${{ matrix.profile_id }}
          path: ${{ runner.temp }}/resource-observation-${{ matrix.profile_id }}/
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate resource evidence
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out planned source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Download calibration plan
        uses: actions/download-artifact@v7
        with:
          name: firmware-resource-plan
          path: ${{ runner.temp }}/resource-plan

      - name: Download per-profile observations
        uses: actions/download-artifact@v7
        with:
          pattern: resource-observation-*
          path: ${{ runner.temp }}/resource-downloads

      - name: Merge deterministic resource index
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/resource-matrix"
          mkdir -p "$output"
          mapfile -d '' index_files < <(
            find "$RUNNER_TEMP/resource-downloads" \
              -name resource-index.json -print0 | sort -z
          )
          if (( ${#index_files[@]} > 0 )); then
            python3 misc/firmware_builder/matrix.py merge \
              --observations "${index_files[@]}" \
              --output "$output/resource-index.json"
          else
            python3 - "$output/resource-index.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "misc/firmware_builder"))
          import matrix

          Path(sys.argv[1]).write_text(
              json.dumps(matrix.merge_reports([]), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          fi
          python3 misc/firmware_builder/catalog.py catalog \
            --root "$GITHUB_WORKSPACE" > "$output/catalog.json"

      - name: Summarize resource coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - \
            "$RUNNER_TEMP/resource-matrix/resource-index.json" \
            "$RUNNER_TEMP/resource-plan/calibration-matrix.json" \
            "$RUNNER_TEMP/resource-matrix/coverage-summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          index = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          plan = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          observations = index["observations"]
          diagnostics = index["diagnostics"]
          summary = {
              "schema_version": 1,
              "planned_profiles": len(plan["include"]),
              "observed_contexts": len(observations),
              "diagnostic_contexts": len(diagnostics),
              "accepted_observations": sum(
                  item["status"] == "accepted" for item in observations
              ),
              "rejected_observations": sum(
                  item["status"] == "rejected" for item in observations
              ),
              "unmeasured_profiles": max(
                  0,
                  len(plan["include"]) - len(observations) - len(diagnostics),
              ),
          }
          Path(sys.argv[3]).write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload merged resource contract
        uses: actions/upload-artifact@v7
        with:
          name: firmware-resource-index
          path: |
            ${{ runner.temp }}/resource-matrix/resource-index.json
            ${{ runner.temp }}/resource-matrix/catalog.json
            ${{ runner.temp }}/resource-matrix/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
