name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The general build always runs. Extra trim sweeps run on master/manual builds,
  # and on PRs only when changed files can affect trim or its build inputs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_trim: ${{ steps.changed-files.outputs.run_trim }}
    steps:
    - name: Determine whether extra trim jobs are needed
      id: changed-files
      uses: actions/github-script@v8
      with:
        script: |
          function setRunTrim(value, reason) {
            core.info(`${reason}; run_trim=${value}`);
            core.setOutput('run_trim', String(value));
          }

          try {
            const { owner, repo } = context.repo;

            if (context.eventName === 'workflow_dispatch' ||
                (context.eventName === 'push' && context.ref === 'refs/heads/master')) {
              setRunTrim(true, 'Full sweep requested for master or manual dispatch');
              return;
            }

            if (context.eventName === 'push') {
              setRunTrim(false, 'Feature push only needs the general build');
              return;
            }

            if (context.eventName !== 'pull_request') {
              setRunTrim(true, 'Unknown event; retaining the full sweep');
              return;
            }

            const pullNumber = context.payload.pull_request?.number;
            const changedFilesValue = context.payload.pull_request?.changed_files;
            const changedFiles = Number(changedFilesValue);
            if (!Number.isInteger(pullNumber) || changedFilesValue == null ||
                !Number.isSafeInteger(changedFiles) || changedFiles < 0) {
              setRunTrim(true, 'Missing or invalid pull request metadata');
              return;
            }

            if (changedFiles >= 3000) {
              setRunTrim(true, 'Pull request reaches the GitHub changed-files cap');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100
            });

            if (files.length < changedFiles) {
              setRunTrim(true, `Incomplete file list (${files.length} of ${changedFiles})`);
              return;
            }

            const sourceExtension = /\.(?:c|cc|cpp|cxx|h|hh|hpp|hxx|mk|sh)$/;
            const relevantPatterns = [
              /^\.github\/workflows\/build-unit-tests\.yaml$/,
              /^\.github\/workflows\/add-ubuntu-latest-apt-mirrors\.sh$/,
              /^\.gitmodules$/,
              /^misc\/ci\//,
              /^firmware\/(?:controllers|config|generated|tunerstudio|init|util|console|ext|bootloader|integration|pch)\//,
              /^firmware\/hw_layer\//,
              /^firmware\/[^/]+$/,
              /^firmware\/.+\.mk$/,
              /^firmware\/.+\.ld$/,
              /^java_tools\//,
              /^unit_tests\/tests\/(?:ignition_injection|system|util|sensor|trigger)\//,
              /^unit_tests\/tests\/tests\.mk$/,
              /^unit_tests\/(?!tests\/)(?!.*\.(?:md|rst)$).+/
            ];

            const isRelevant = path => {
              // These standalone stepper files remain covered by the general suite.
              if (path === 'firmware/hw_layer/stepper.cpp' || path === 'firmware/hw_layer/stepper.h') {
                return false;
              }
              if (/^firmware\/[^/]+$/.test(path)) {
                return path === 'firmware/Makefile' || sourceExtension.test(path);
              }
              return relevantPatterns.some(pattern => pattern.test(path));
            };

            // Rename detection exposes both sides, so moving into or out of a
            // relevant path conservatively retains the trim sweep.
            const changedPaths = files.flatMap(file =>
              [file.filename, file.previous_filename].filter(Boolean)
            );
            const relevant = changedPaths.find(isRelevant);
            setRunTrim(Boolean(relevant), relevant
              ? `Relevant change: ${relevant}`
              : 'No trim-related files changed');
          } catch (error) {
            core.warning(`Unable to determine changed files: ${error.message}`);
            setRunTrim(true, 'Changed-file lookup failed; retaining the full sweep');
          }

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Discover cores
      if: ${{ matrix.os != 'macos-latest' }}
      run: lscpu | egrep 'Model name|Socket|Thread|NUMA|CPU\(s\)'

    - name: Install required software (ubuntu)
      if: ${{ matrix.os != 'macos-latest' }}
      working-directory: ./.github/workflows/
      run: |
        sudo ./add-ubuntu-latest-apt-mirrors.sh
        sudo apt-get install mtools zip dosfstools sshpass lcov valgrind

    - name: Install required software (macos)
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        brew install mtools zip dosfstools make bash
        echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Print Compiler version
      # NOTE: on mac, this is actually symlink'd to clang, not gcc, but that's ok - we want to build on both
      working-directory: .
      run: |
        gcc -v
        make --version
        bash --version

    - name: Build Tests
      working-directory: ./unit_tests/
      run: make -j4 COVERAGE=yes

    - name: Run Tests
      working-directory: ./unit_tests/
      #run: ASAN_OPTIONS=detect_stack_use_after_return=1 build/fome_test
      run: build/fome_test

    - name: Set FTP variables
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
      run: |
        if [ "${{github.ref}}" = "refs/heads/master" ]; then
          echo "::set-env name=RUSEFI_SSH_SERVER::${{secrets.RUSEFI_SSH_SERVER}}";
          echo "::set-env name=RUSEFI_SSH_USER::${{secrets.RUSEFI_SSH_USER}}";
          echo "::set-env name=RUSEFI_SSH_PASS::${{secrets.RUSEFI_SSH_PASS}}";
        fi

    - name: Generate Code Coverage
      if: ${{ matrix.os != 'macos-latest' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      working-directory: ./unit_tests/
      run: ./ci_gcov.sh ${{ secrets.RUSEFI_SSH_USER }} ${{ secrets.RUSEFI_SSH_PASS }} ${{ secrets.RUSEFI_SSH_SERVER }}

    - name: Run Tests (sharded)
      working-directory: ./unit_tests/
      run: bash ./run_sharded_tests.sh

    - name: Rebuild Tests For Valgrind
      # Valgrind isn't compatible with address sanitizer, so we have to rebuild the code
      if: ${{ matrix.os != 'macos-latest' }}
      working-directory: ./unit_tests/
      run: |
        make clean
        make -j4 SANITIZE=no

    - name: Run Tests (Valgrind)
      if: ${{ matrix.os != 'macos-latest' }}
      working-directory: ./unit_tests/
      run: valgrind --error-exitcode=1 --exit-on-first-error=yes --leak-check=no --show-error-list=yes build/fome_test

  cylinder-fuel-trim:
    name: Cylinder Fuel Trim (${{ matrix.trim_count }} cylinders)
    needs: changes
    if: ${{ needs.changes.outputs.run_trim == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trim_count: [2, 4, 6, 12]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install required software
      working-directory: ./.github/workflows/
      run: |
        sudo ./add-ubuntu-latest-apt-mirrors.sh
        sudo apt-get install mtools zip dosfstools

    - name: Build native tests with explicit module profile
      working-directory: ./unit_tests/
      run: >
        make -j4 COVERAGE=yes
        FOME_MODULES='fan fuel_pump gear_detector tachometer trip_odometer map_averaging boost engine_sniffer lua cylinder_fuel_trim'
        FOME_CYLINDER_TRIM_COUNT=${{ matrix.trim_count }}

    - name: Run full native suite (12-cylinder profile)
      if: ${{ matrix.trim_count == 12 }}
      working-directory: ./unit_tests/
      run: build/fome_test

    - name: Run focused native suite
      if: ${{ matrix.trim_count != 12 }}
      working-directory: ./unit_tests/
      run: build/fome_test --gtest_filter='EnginePresetPolicy.*:CylinderFuelTrim.*:CylinderFuelTrimIntegration.*'

  cylinder-fuel-trim-arm:
    name: Cylinder Fuel Trim ARM (12 cylinders)
    needs: changes
    if: ${{ needs.changes.outputs.run_trim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false

    - uses: actions/setup-java@v6.0.1
      with:
        distribution: zulu
        java-version: '21'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib g++-multilib mtools dosfstools zip xxd rsync

    - name: Build and verify Core8 max module profile
      env:
        FOME_MODULES: 'fan fuel_pump gear_detector tachometer trip_odometer map_averaging hella_opst boost engine_sniffer lua emp_pump shock_preload cylinder_fuel_trim'
        FOME_CYLINDER_TRIM_COUNT: '12'
        JOBS: '4'
      run: bash misc/ci/capoworks-checks.sh core8

    - name: Upload check logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: cylinder-fuel-trim-arm-checks
        path: build/capoworks-checks/core8/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload Core8 firmware and INI
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: cylinder-fuel-trim-arm-firmware
        path: |
          firmware/deliver/fome.bin
          firmware/deliver/fome_update.srec
          firmware/deliver/fome_bl.srec
          firmware/tunerstudio/generated/fome_core8.ini
        if-no-files-found: error
        retention-days: 14
