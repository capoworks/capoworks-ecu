name: Unit Tests

on: [push,pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Discover cores
      if: ${{ matrix.os != 'macos-latest' }}
      run: lscpu | egrep 'Model name|Socket|Thread|NUMA|CPU\(s\)'

    - name: Install required software (ubuntu)
      if: ${{ matrix.os != 'macos-latest' }}
      working-directory: ./.github/workflows/
      run: |
        sudo ./add-ubuntu-latest-apt-mirrors.sh
        sudo apt-get install mtools zip dosfstools sshpass lcov valgrind

    - name: Install required software (macos)
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        brew install mtools zip dosfstools make bash
        echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Print Compiler version
      # NOTE: on mac, this is actually symlink'd to clang, not gcc, but that's ok - we want to build on both
      working-directory: .
      run: |
        gcc -v
        make --version
        bash --version

    - name: Build Tests
      working-directory: ./unit_tests/
      run: make -j4 COVERAGE=yes

    - name: Run Tests
      working-directory: ./unit_tests/
      #run: ASAN_OPTIONS=detect_stack_use_after_return=1 build/fome_test
      run: build/fome_test

    - name: Set FTP variables
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
      run: |
        if [ "${{github.ref}}" = "refs/heads/master" ]; then
          echo "::set-env name=RUSEFI_SSH_SERVER::${{secrets.RUSEFI_SSH_SERVER}}";
          echo "::set-env name=RUSEFI_SSH_USER::${{secrets.RUSEFI_SSH_USER}}";
          echo "::set-env name=RUSEFI_SSH_PASS::${{secrets.RUSEFI_SSH_PASS}}";
        fi

    - name: Generate Code Coverage
      if: ${{ matrix.os != 'macos-latest' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      working-directory: ./unit_tests/
      run: ./ci_gcov.sh ${{ secrets.RUSEFI_SSH_USER }} ${{ secrets.RUSEFI_SSH_PASS }} ${{ secrets.RUSEFI_SSH_SERVER }}

    - name: Run Tests (sharded)
      working-directory: ./unit_tests/
      run: bash ./run_sharded_tests.sh

    - name: Rebuild Tests For Valgrind
      # Valgrind isn't compatible with address sanitizer, so we have to rebuild the code
      if: ${{ matrix.os != 'macos-latest' }}
      working-directory: ./unit_tests/
      run: |
        make clean
        make -j4 SANITIZE=no

    - name: Run Tests (Valgrind)
      if: ${{ matrix.os != 'macos-latest' }}
      working-directory: ./unit_tests/
      run: valgrind --error-exitcode=1 --exit-on-first-error=yes --leak-check=no --show-error-list=yes build/fome_test

  cylinder-fuel-trim:
    name: Cylinder Fuel Trim (${{ matrix.trim_count }} cylinders)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trim_count: [4, 6, 12]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install required software
      working-directory: ./.github/workflows/
      run: |
        sudo ./add-ubuntu-latest-apt-mirrors.sh
        sudo apt-get install mtools zip dosfstools

    - name: Build native tests with explicit module profile
      working-directory: ./unit_tests/
      run: >
        make -j4 COVERAGE=yes
        FOME_MODULES='fan fuel_pump gear_detector tachometer trip_odometer map_averaging boost engine_sniffer lua cylinder_fuel_trim'
        FOME_CYLINDER_TRIM_COUNT=${{ matrix.trim_count }}

    - name: Run full native suite (12-cylinder profile)
      if: ${{ matrix.trim_count == 12 }}
      working-directory: ./unit_tests/
      run: build/fome_test

    - name: Run focused native suite
      if: ${{ matrix.trim_count != 12 }}
      working-directory: ./unit_tests/
      run: build/fome_test --gtest_filter='CylinderFuelTrim.*:CylinderFuelTrimIntegration.*'

  cylinder-fuel-trim-arm:
    name: Cylinder Fuel Trim ARM (12 cylinders)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false

    - uses: actions/setup-java@v6.0.1
      with:
        distribution: zulu
        java-version: '21'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib g++-multilib mtools dosfstools zip xxd rsync

    - name: Build and verify Core8 max module profile
      env:
        FOME_MODULES: 'fan fuel_pump gear_detector tachometer trip_odometer map_averaging hella_opst boost engine_sniffer lua emp_pump shock_preload cylinder_fuel_trim'
        FOME_CYLINDER_TRIM_COUNT: '12'
        JOBS: '4'
      run: bash misc/ci/capoworks-checks.sh core8

    - name: Upload check logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: cylinder-fuel-trim-arm-checks
        path: build/capoworks-checks/core8/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload Core8 firmware and INI
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: cylinder-fuel-trim-arm-firmware
        path: |
          firmware/deliver/fome.bin
          firmware/deliver/fome_update.srec
          firmware/deliver/fome_bl.srec
          firmware/tunerstudio/generated/fome_core8.ini
        if-no-files-found: error
        retention-days: 14
