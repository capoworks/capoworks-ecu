[GaugeConfigurations]
gaugeCategory = Shock Preload
	shockPreloadPositionGauge = shockPreloadPosition, "Shock preload position", "%", 0, 100, 0, 0, 100, 100, 0, 0
	shockPreloadTargetGauge = shockPreloadTarget, "Shock preload target", "%", 0, 100, 0, 0, 100, 100, 0, 0

[FrontPage]
	indicator = { shockPreloadPreset0Active }, "Shock preset 0 inactive", "Shock preset 0 active", white, black, green, black
	indicator = { shockPreloadPreset1Active }, "Shock preset 1 inactive", "Shock preset 1 active", white, black, green, black
	indicator = { shockPreloadPreset2Active }, "Shock preset 2 inactive", "Shock preset 2 active", white, black, green, black
