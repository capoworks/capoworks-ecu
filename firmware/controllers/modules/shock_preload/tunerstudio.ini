displayCommand = cmd_shock_preload_load_3, "Shock preload: select preset 3"
displayCommand = cmd_shock_preload_load_4, "Shock preload: select preset 4"

[UserDefined]
	indicatorPanel = shockPreloadIndicators, 2
		indicator = { shockPreloadOnline }, "shock preload offline", "shock preload online", white, black, green, black
		indicator = { shockPreloadAtPreset }, "not at saved preset", "at saved preset", white, black, green, black
		indicator = { shockPreloadPreset0Active }, "preset 0 inactive", "preset 0 active", white, black, green, black
		indicator = { shockPreloadPreset1Active }, "preset 1 inactive", "preset 1 active", white, black, green, black
		indicator = { shockPreloadPreset2Active }, "preset 2 inactive", "preset 2 active", white, black, green, black
		indicator = { shockPreloadPreset3Active }, "preset 3 inactive", "preset 3 active", white, black, green, black
		indicator = { shockPreloadPreset4Active }, "preset 4 inactive", "preset 4 active", white, black, green, black

	dialog = shockPreload, "Shock preload", yAxis
		field = "Uses secondary CAN (CAN2), standard IDs 0x720-0x722. CAN read and write must be enabled."
		field = "Enable shock preload", enableShockPreload
		field = "Target", shockPreloadCommandTarget, { enableShockPreload }
		commandButton = "Set target", cmd_shock_preload_target, { enableShockPreload }
		panel = shockPreloadIndicators
		gauge = shockPreloadPositionGauge
		gauge = shockPreloadTargetGauge
		commandButton = "-2%", cmd_shock_preload_down_2, { enableShockPreload }
		commandButton = "+2%", cmd_shock_preload_up_2, { enableShockPreload }
		commandButton = "Stop", cmd_shock_preload_stop, { enableShockPreload }
		commandButton = "Status", cmd_shock_preload_request_status, { enableShockPreload }
		commandButton = "Load S0", cmd_shock_preload_load_0, { enableShockPreload }
		commandButton = "Load S1", cmd_shock_preload_load_1, { enableShockPreload }
		commandButton = "Load S2", cmd_shock_preload_load_2, { enableShockPreload }
		commandButton = "Load S3", cmd_shock_preload_load_3, { enableShockPreload }
		commandButton = "Load S4", cmd_shock_preload_load_4, { enableShockPreload }
		commandButton = "Save S0", cmd_shock_preload_save_0, { enableShockPreload }
		commandButton = "Save S1", cmd_shock_preload_save_1, { enableShockPreload }
		commandButton = "Save S2", cmd_shock_preload_save_2, { enableShockPreload }
		commandButton = "Save S3", cmd_shock_preload_save_3, { enableShockPreload }
		commandButton = "Save S4", cmd_shock_preload_save_4, { enableShockPreload }
		commandButton = "Clear alarms", cmd_shock_preload_clear_alarms, { enableShockPreload }
		commandButton = "Reference 0%", cmd_shock_preload_reference_0, { enableShockPreload }
		commandButton = "Reference 50%", cmd_shock_preload_reference_50, { enableShockPreload }
		commandButton = "Calibrate", cmd_shock_preload_calibrate, { enableShockPreload }
