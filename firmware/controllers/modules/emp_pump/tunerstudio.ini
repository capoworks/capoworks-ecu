[CurveEditor]
	curve = empPumpFallbackCurve, "EMP pump CLT fallback"
		columnLabel = "CLT", "Pump RPM"
		xAxis = -40, 150, 10
		yAxis = 0, 7000, 10
		xBins = empPump_temperatureBins, coolant
		yBins = empPump_rpmBins
		showTextValues = true

	curve = empPumpMinimumFlowCurve, "EMP pump minimum safe flow"
		columnLabel = "Engine RPM", "Pump RPM"
		xAxis = 0, 10000, 10
		yAxis = 0, 7000, 10
		xBins = empPump_engineRpmBins, RPMValue
		yBins = empPump_minimumFlowRpmBins
		showTextValues = true

[GaugeConfigurations]
gaugeCategory = EMP Pump
	empPumpTargetGauge = empPumpTargetRpm, "EMP pump target", "RPM", 0, 7000, 0, 0, 7000, 7000, 0, 0
	empPumpActualGauge = empPumpActualRpm, "EMP pump actual", "RPM", 0, 7000, 0, 0, 7000, 7000, 0, 0

[Menu.Controller]
		subMenu = empPump,					"EMP coolant pump"

[ControllerCommands]
cmd_emp_pump_service_start = "@@TS_IO_TEST_COMMAND_char@@@@ts_command_e_TS_EMP_PUMP_CATEGORY_16_hex@@@@emp_pump_ts_command_e_EMP_PUMP_SERVICE_START_16_hex@@"
cmd_emp_pump_service_stop = "@@TS_IO_TEST_COMMAND_char@@@@ts_command_e_TS_EMP_PUMP_CATEGORY_16_hex@@@@emp_pump_ts_command_e_EMP_PUMP_SERVICE_STOP_16_hex@@"

[UserDefined]
	dialog = empPump, "EMP coolant pump", yAxis
		field = "Uses extended J1939 CAN. Core8 Bus 0 is CAN1 on PD0/PD1 at 500 kbit/s."
		field = "Enable EMP pump", enableEmpPump
		field = "CAN bus", empPump_canBus, { enableEmpPump }
		field = "Pump controller address", empPump_controllerAddress, { enableEmpPump }
		field = "ECU source address", empPump_sourceAddress, { enableEmpPump }
		field = "Closed-loop CLT control", empPump_closedLoopEnabled, { enableEmpPump }
		field = "CLT target", empPump_targetTemperature, { enableEmpPump && empPump_closedLoopEnabled }
		field = "CLT control deadband", empPump_temperatureDeadband, { enableEmpPump && empPump_closedLoopEnabled }
		field = "Proportional gain", empPump_proportionalGain, { enableEmpPump && empPump_closedLoopEnabled }
		field = "Integral gain", empPump_integralGain, { enableEmpPump && empPump_closedLoopEnabled }
		field = "Integral limit", empPump_integralLimitRpm, { enableEmpPump && empPump_closedLoopEnabled }
		field = "Minimum running speed", empPump_minimumRunRpm, { enableEmpPump }
		field = "Maximum speed", empPump_maximumRpm, { enableEmpPump }
		field = "Failsafe speed", empPump_failsafeRpm, { enableEmpPump }
		field = "Command ramp", empPump_rampRpmPerSecond, { enableEmpPump }
		panel = empPumpFallbackCurve, { enableEmpPump }
		panel = empPumpMinimumFlowCurve, { enableEmpPump }
		field = "Enable after-run", empPump_afterRunEnabled, { enableEmpPump }
		field = "After-run start CLT", empPump_afterRunStartTemperature, { enableEmpPump && empPump_afterRunEnabled }
		field = "After-run stop CLT", empPump_afterRunStopTemperature, { enableEmpPump && empPump_afterRunEnabled }
		field = "After-run maximum duration", empPump_afterRunMaximumSeconds, { enableEmpPump && empPump_afterRunEnabled }
		field = "After-run minimum speed", empPump_afterRunMinimumRpm, { enableEmpPump && empPump_afterRunEnabled }
		field = "Request EMP Power Hold", empPump_powerHoldEnabled, { enableEmpPump && empPump_afterRunEnabled }
		field = "Battery cutoff", empPump_batteryCutoff10, { enableEmpPump && empPump_afterRunEnabled }
		field = "Battery resume", empPump_batteryResume10, { enableEmpPump && empPump_afterRunEnabled }
		field = "Power Hold does not power the ECU. Post-key-off after-run requires a separately wired ECU hold/ignition signal."
		field = "Service RPM", empPump_manualTestRpm, { enableEmpPump }
		field = "Service duration", empPump_manualTestSeconds, { enableEmpPump }
		field = "Allow service while engine runs", empPump_serviceAllowedWhileRunning, { enableEmpPump }
		commandButton = "Service start", cmd_emp_pump_service_start, { enableEmpPump }
		commandButton = "Service stop", cmd_emp_pump_service_stop, { enableEmpPump }
		gauge = empPumpTargetGauge
		gauge = empPumpActualGauge
